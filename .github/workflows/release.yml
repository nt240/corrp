name: Build and Release (Linux only)

on:
  push:
    tags:
      - 'v*'  # タグ push で実行

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          override: true

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Linux static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: corrp-linux
          path: target/x86_64-unknown-linux-musl/release/corrp

  release:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: corrp-linux
          path: release-binaries

      - name: Setup gh CLI
        uses: cli/gh-action@v3

      - name: Create GitHub Release and upload asset
        run: |
          gh release create ${{ github.ref_name }} release-binaries/corrp \
            --title "Release ${{ github.ref_name }}" \
            --notes "Linux static binary of corrp CLI"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
